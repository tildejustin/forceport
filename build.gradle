plugins {
	id 'fabric-loom' version '1.19-SNAPSHOT'
	id 'ploceus' version '1.19-SNAPSHOT'
	id 'maven-publish'
}

version = "${project.mod_version}+MC${project.release_mc_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {url "https://jitpack.io" }
}

dependencies {
	//to change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings ploceus.featherMappings(project.feather_build)
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modCompileOnly "com.github.contariaa:speedrunapi:${project.speedrunapi_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile) {
	options.encoding = "UTF-8"
	it.options.release = 8
}

java {
	sourceCompatibility = JavaVersion.VERSION_1_8
	targetCompatibility = JavaVersion.VERSION_1_8
}

jar {
	from "LICENSE"
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}

	repositories {
	}
}